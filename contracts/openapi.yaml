          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/SessionGrant
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
