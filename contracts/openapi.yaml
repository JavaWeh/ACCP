  /adapters/handshake:
    post:
      operationId: handshakeAdapter
      tags:
        - Adapters
      summary: handshake Adapter
      description: Implemented in M2. Authorization is derived from current identity, membership and delegation. See
        docs/m2-execution.md for state and recovery semantics. Only protocol 0.2 is selected. M2 does not
        advertise mcp_uri because the Gateway is not implemented. The submitted manifest must match human
        registration.
      x-accp-milestone: M2
      x-accp-actors:
        - AGENT
      security:
        - AgentBearer: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Stable key for the same logical operation; retries must preserve body, version and fence.
          schema:
            type: string
            minLength: 8
            maxLength: 128
      responses:
        "200":
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: ./schemas/m2.schema.json#/$defs/HandshakeResponse
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
