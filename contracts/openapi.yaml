components:
  securitySchemes:
    HumanBearer:
      type: http
      scheme: bearer
      bearerFormat: Human access token
      description: Validated OIDC-backed human identity for ACCP; project roles checked server-side.
    AgentBearer:
      type: http
      scheme: bearer
      bearerFormat: Scoped ACCP session token
      description: Short-lived audience-bound token; session id alone is not a credential.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per actor, route and resource; same key with different input returns 409.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted resource version returned as ETag; 412 on stale version, 428 when absent.
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    Fencing:
      name: X-Run-Fencing-Token
      in: header
      required: true
      description: Current server-issued run fencing token; stale or expired leases cannot write.
      schema:
        type: integer
        minimum: 1
  responses:
    Problem:
      description: Authentication, authorization, version or domain failure; see code and trace_id.
      content:
        application/problem+json:
          schema:
            $ref: ./schemas/domain.schema.json#/$defs/Problem
