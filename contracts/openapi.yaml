        - AgentBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Scoped resource identifier.
          schema: *a1
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: ./schemas/m2.schema.json#/$defs/TaskDependencyPage
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "410":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
      x-accp-required-scope: tasks:read
  /tasks/{id}/assignments:
    post:
      operationId: assignTask
      tags:
        - Tasks
      summary: assign Task
      description: Implemented in M2. Authorization is derived from current identity, membership and delegation. See
