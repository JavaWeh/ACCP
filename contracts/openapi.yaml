openapi: 3.1.1
info:
  title: ACCP Collaboration API
  version: 0.2.0
  description: ACCP Collaboration Protocol v0.2. M1 and M2 operations are implemented. Operations marked future
    are target contracts and return 404. M2 adds delegated Agent execution and events; final acceptance, Git
    provider verification and MCP Gateway remain M3. See docs/m2-execution.md.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ACCP maintainers
    url: https://github.com/JavaWeh/ACCP
servers:
  - url: https://accp.example/api/v1
    description: Reserved example host; not a deployment
tags:
  - name: Tasks
    description: Tasks domain interfaces; draft v0.1
  - name: Identity
    description: Identity domain interfaces; draft v0.1
  - name: Contexts
    description: Contexts domain interfaces; draft v0.1
  - name: Artifacts
    description: Artifacts domain interfaces; draft v0.1
  - name: Governance
    description: Governance domain interfaces; draft v0.1
  - name: Events
    description: Events domain interfaces; draft v0.1
  - name: Adapters
    description: Adapters domain interfaces; draft v0.1
security:
  - HumanBearer: []
  - AgentBearer: []
paths:
  /projects/{id}/repositories:
    get:
      operationId: listRepositories
      tags:
        - Tasks
      summary: List configured repositories
      description: Read project repository configuration; first provider planned is GitHub.
      x-accp-actors:
        - HUMAN
      security:
        - HumanBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Opaque resource identifier; scope is verified server-side.
          schema:
            type: string
            minLength: 1
        - name: cursor
          in: query
          required: false
          description: Opaque continuation cursor.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Successful operation. Human ownership and resource scopes are validated by the server.
          headers:
            ETag:
              description: Quoted resource version when returning a versioned entity.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/RepositoryPage
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
      x-accp-milestone: M1
  /projects/{id}/tasks:
    post:
      operationId: createTask
      tags:
        - Tasks
      summary: Create a human-owned task
      description: Creates DRAFT. Owner must be an active human member; repository and Context versions must belong
        to this project.
      x-accp-actors:
        - HUMAN
      security:
        - HumanBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Opaque resource identifier; scope is verified server-side.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Successful operation. Human ownership and resource scopes are validated by the server.
          headers:
            ETag:
              description: Quoted resource version when returning a versioned entity.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/Task
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/domain.schema.json#/$defs/CreateTask
      x-accp-milestone: M1
    get:
      operationId: listTasks
      tags:
        - Tasks
      summary: List project tasks
      description: Read authorized project tasks. M2 also allows a scoped Agent Session in the same project.
      x-accp-actors:
        - HUMAN
        - AGENT
      security:
        - HumanBearer: []
        - AgentBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Opaque resource identifier; scope is verified server-side.
          schema:
            type: string
            minLength: 1
        - name: cursor
          in: query
          required: false
          description: Opaque continuation cursor.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Successful operation. Human ownership and resource scopes are validated by the server.
          headers:
            ETag:
              description: Quoted resource version when returning a versioned entity.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/TaskPage
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
      x-accp-milestone: M1
      x-accp-required-scope: tasks:read
  /tasks/{id}:
    get:
      operationId: getTask
      tags:
        - Tasks
      summary: Read task state
      description: Authoritative state; events are notifications, not a replacement for this read. M2 also allows a
        scoped Agent Session in the same project.
      x-accp-actors:
        - HUMAN
        - AGENT
      security:
        - HumanBearer: []
        - AgentBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Opaque resource identifier; scope is verified server-side.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Successful operation. Human ownership and resource scopes are validated by the server.
          headers:
            ETag:
              description: Quoted resource version when returning a versioned entity.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/Task
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
      x-accp-milestone: M1
      x-accp-required-scope: tasks:read
  /tasks/{id}/commands:
    post:
      operationId: commandTask
      tags:
        - Tasks
      summary: Submit, retry or cancel a task
      description: Human Owner or ADMIN submits, retries or cancels execution with the current Task version. RETRY
        creates no Run until the next authorized claim. Cancellation closes the active Run; DONE is immutable.
      x-accp-actors:
        - HUMAN
      security:
        - HumanBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Opaque resource identifier; scope is verified server-side.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Successful operation. Human ownership and resource scopes are validated by the server.
          headers:
            ETag:
              description: Quoted resource version when returning a versioned entity.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/Task
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/domain.schema.json#/$defs/TaskCommand
      x-accp-milestone: M1
  /tasks/{id}/dependencies:
    post:
      operationId: createDependency
      tags:
        - Tasks
      summary: create Dependency
      description: Implemented in M2. Authorization is derived from current identity, membership and delegation. See
        docs/m2-execution.md for state and recovery semantics.
      x-accp-milestone: M2
      x-accp-actors:
        - HUMAN
      security:
        - HumanBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Scoped resource identifier.
          schema: &a1
            type: string
            pattern: ^[a-zA-Z][a-zA-Z0-9_.:-]{1,127}$
        - name: Idempotency-Key
          in: header
          required: true
          description: Stable key for the same logical operation; retries must preserve body, version and fence.
          schema:
            type: string
            minLength: 8
            maxLength: 128
        - name: If-Match
          in: header
          required: true
          description: Quoted current Task version. Read Task again after assignment or dependency changes.
          schema:
            type: string
      responses:
        "201":
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/TaskDependency
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "410":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/domain.schema.json#/$defs/CreateDependency
    get:
      operationId: listTaskDependencies
      tags:
        - Tasks
      summary: list Task Dependencies
      description: Implemented in M2. Authorization is derived from current identity, membership and delegation. See
