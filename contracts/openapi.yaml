            maxLength: 128
        - name: If-Match
          in: header
          required: true
          description: Quoted current Task version. Read Task again after assignment or dependency changes.
          schema:
            type: string
      responses:
        "201":
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/Assignment
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "410":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/domain.schema.json#/$defs/CreateAssignment
    get:
      operationId: listTaskAssignments
      tags:
        - Tasks
      summary: list Task Assignments
      description: Implemented in M2. Authorization is derived from current identity, membership and delegation. See
        docs/m2-execution.md for state and recovery semantics.
      x-accp-milestone: M2
      x-accp-actors:
        - HUMAN
      security:
        - HumanBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Scoped resource identifier.
          schema: *a1
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: ./schemas/m2.schema.json#/$defs/AssignmentPage
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "410":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /agents:
    post:
      operationId: registerAgent
      tags:
        - Identity
      summary: register Agent
      description: Implemented in M2. Authorization is derived from current identity, membership and delegation. See
        docs/m2-execution.md for state and recovery semantics.
      x-accp-milestone: M2
