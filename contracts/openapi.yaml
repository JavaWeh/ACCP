openapi: 3.1.1
info:
  title: ACCP Collaboration API
  version: 0.1.0
  description: Design contract only; no running service. Human accountability, scoped Agent Sessions and
    immutable execution context. See docs/protocol.md for server-enforced semantics.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ACCP maintainers
    url: https://github.com/JavaWeh/ACCP
servers:
  - url: https://accp.example/api/v1
    description: Reserved example host; not a deployment
tags:
  - name: Tasks
    description: Tasks domain interfaces; draft v0.1
  - name: Identity
    description: Identity domain interfaces; draft v0.1
  - name: Contexts
    description: Contexts domain interfaces; draft v0.1
  - name: Artifacts
    description: Artifacts domain interfaces; draft v0.1
  - name: Governance
    description: Governance domain interfaces; draft v0.1
  - name: Events
    description: Events domain interfaces; draft v0.1
  - name: Adapters
    description: Adapters domain interfaces; draft v0.1
security:
  - HumanBearer: []
  - AgentBearer: []
paths:
  /projects/{id}/repositories:
    get:
      operationId: listRepositories
      tags:
        - Tasks
      summary: List configured repositories
      description: Read project repository configuration; first provider planned is GitHub.
      x-accp-actors:
        - HUMAN
        - AGENT
      security:
        - HumanBearer: []
        - AgentBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Opaque resource identifier; scope is verified server-side.
          schema:
            type: string
            minLength: 1
        - name: cursor
          in: query
          required: false
          description: Opaque continuation cursor.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Successful operation. Human ownership and resource scopes are validated by the server.
          headers:
            ETag:
              description: Quoted resource version when returning a versioned entity.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/RepositoryPage
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /projects/{id}/tasks:
    post:
      operationId: createTask
      tags:
        - Tasks
      summary: Create a human-owned task
      description: Creates DRAFT. Owner must be an active human member; repository and Context versions must belong
        to this project.
      x-accp-actors:
        - HUMAN
      security:
        - HumanBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Opaque resource identifier; scope is verified server-side.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Successful operation. Human ownership and resource scopes are validated by the server.
          headers:
            ETag:
              description: Quoted resource version when returning a versioned entity.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/Task
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/domain.schema.json#/$defs/CreateTask
    get:
      operationId: listTasks
      tags:
        - Tasks
      summary: List project tasks
      description: Read authorized project tasks.
      x-accp-actors:
        - HUMAN
        - AGENT
      security:
        - HumanBearer: []
        - AgentBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Opaque resource identifier; scope is verified server-side.
          schema:
            type: string
            minLength: 1
        - name: cursor
          in: query
          required: false
          description: Opaque continuation cursor.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Successful operation. Human ownership and resource scopes are validated by the server.
          headers:
            ETag:
              description: Quoted resource version when returning a versioned entity.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/TaskPage
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /tasks/{id}:
    get:
      operationId: getTask
      tags:
        - Tasks
      summary: Read task state
      description: Authoritative state; events are notifications, not a replacement for this read.
      x-accp-actors:
        - HUMAN
        - AGENT
      security:
        - HumanBearer: []
        - AgentBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Opaque resource identifier; scope is verified server-side.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Successful operation. Human ownership and resource scopes are validated by the server.
          headers:
            ETag:
              description: Quoted resource version when returning a versioned entity.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/Task
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /tasks/{id}/commands:
    post:
      operationId: commandTask
      tags:
        - Tasks
      summary: Submit, retry or cancel a task
      description: Task Owner or ADMIN with reason. RETRY creates a new attempt on later claim. Cancellation does
        not imply external rollback.
      x-accp-actors:
        - HUMAN
      security:
        - HumanBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Opaque resource identifier; scope is verified server-side.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Successful operation. Human ownership and resource scopes are validated by the server.
          headers:
            ETag:
              description: Quoted resource version when returning a versioned entity.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/Task
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/domain.schema.json#/$defs/TaskCommand
  /tasks/{id}/dependencies:
    post:
      operationId: createDependency
      tags:
        - Tasks
      summary: Add a prerequisite
      description: Only editable task states; same project; reject cycles and self-dependency. Check DAG within
        project transaction lock.
      x-accp-actors:
        - HUMAN
      security:
        - HumanBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Opaque resource identifier; scope is verified server-side.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "201":
          description: Successful operation. Human ownership and resource scopes are validated by the server.
          headers:
            ETag:
              description: Quoted resource version when returning a versioned entity.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/TaskDependency
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/domain.schema.json#/$defs/CreateDependency
  /tasks/{id}/assignments:
    post:
      operationId: assignTask
      tags:
        - Tasks
      summary: Assign executor or capability queue
      description: Human Owner authorizes execution; assignment cannot change ownership.
      x-accp-actors:
        - HUMAN
      security:
        - HumanBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Opaque resource identifier; scope is verified server-side.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "201":
          description: Successful operation. Human ownership and resource scopes are validated by the server.
          headers:
            ETag:
              description: Quoted resource version when returning a versioned entity.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/Assignment
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/domain.schema.json#/$defs/CreateAssignment
  /agents:
    post:
      operationId: registerAgent
      tags:
        - Identity
      summary: Register an Agent identity
      description: Human member registers a client and its Adapter manifest. Does not itself grant execution permissions.
      x-accp-actors:
        - HUMAN
      security:
        - HumanBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Successful operation. Human ownership and resource scopes are validated by the server.
          headers:
            ETag:
              description: Quoted resource version when returning a versioned entity.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/AgentIdentity
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/domain.schema.json#/$defs/AgentRegistration
  /agent-sessions:
    post:
      operationId: createAgentSession
      tags:
        - Identity
      summary: Delegate a scoped Agent session
      description: Human identity determines delegator; scopes cannot exceed current human permissions. Token must
        not be logged.
      x-accp-actors:
        - HUMAN
      security:
        - HumanBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Successful operation. Human ownership and resource scopes are validated by the server.
          headers:
            ETag:
              description: Quoted resource version when returning a versioned entity.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/SessionGrant
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/domain.schema.json#/$defs/CreateSession
  /agent-sessions/{id}/revoke:
    post:
      operationId: revokeAgentSession
      tags:
        - Identity
      summary: Revoke an Agent session
      description: Delegator or ADMIN revokes pending and future controlled actions. Already-running external
        effects require reconciliation.
      x-accp-actors:
        - HUMAN
      security:
        - HumanBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Opaque resource identifier; scope is verified server-side.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Successful operation. Human ownership and resource scopes are validated by the server.
          headers:
            ETag:
              description: Quoted resource version when returning a versioned entity.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/AgentSession
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/domain.schema.json#/$defs/Reason
  /adapters/handshake:
    post:
      operationId: handshakeAdapter
      tags:
        - Adapters
      summary: Negotiate collaboration capabilities
      description: Select a supported protocol and capability subset; reject unsupported versions. Does not grant
        additional scopes.
      x-accp-actors:
        - AGENT
      security:
        - AgentBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Successful operation. Human ownership and resource scopes are validated by the server.
          headers:
            ETag:
              description: Quoted resource version when returning a versioned entity.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas/adapter.schema.json#/$defs/HandshakeResponse
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/adapter.schema.json#/$defs/HandshakeRequest
  /task-runs/claim:
    post:
      operationId: claimTaskRun
      tags:
        - Tasks
      summary: Atomically claim eligible work
      description: Agent session identity is inferred. Pin published, readable contexts; allocate lease and fencing
        token. Return 409 NO_ELIGIBLE_TASK when none is available.
      x-accp-actors:
        - AGENT
      security:
        - AgentBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Successful operation. Human ownership and resource scopes are validated by the server.
          headers:
            ETag:
              description: Quoted resource version when returning a versioned entity.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/ClaimResponse
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/domain.schema.json#/$defs/ClaimRequest
  /task-runs/{id}:
    get:
      operationId: getTaskRun
      tags:
        - Tasks
      summary: Read execution attempt
      description: Agent may read only its authorized run; human project access still applies.
      x-accp-actors:
        - HUMAN
        - AGENT
      security:
        - HumanBearer: []
        - AgentBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Opaque resource identifier; scope is verified server-side.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Successful operation. Human ownership and resource scopes are validated by the server.
          headers:
            ETag:
              description: Quoted resource version when returning a versioned entity.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/TaskRun
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /task-runs/{id}/heartbeat:
    post:
      operationId: heartbeatTaskRun
      tags:
        - Tasks
      summary: Renew active execution lease
      description: Check current session and fencing. Expired leases cannot be resurrected. Response includes
        cancellation and Context update signals.
      x-accp-actors:
        - AGENT
      security:
        - AgentBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Opaque resource identifier; scope is verified server-side.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/Fencing"
      responses:
        "200":
          description: Successful operation. Human ownership and resource scopes are validated by the server.
          headers:
            ETag:
              description: Quoted resource version when returning a versioned entity.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/HeartbeatResponse
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/domain.schema.json#/$defs/HeartbeatRequest
  /task-runs/{id}/reports:
    post:
      operationId: reportTaskRun
      tags:
        - Tasks
      summary: Report progress or completion candidate
      description: Agent cannot mark Task DONE. Validate artifact ownership and required evidence before completion
        candidate enters review.
      x-accp-actors:
        - AGENT
      security:
        - AgentBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Opaque resource identifier; scope is verified server-side.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/Fencing"
      responses:
        "200":
          description: Successful operation. Human ownership and resource scopes are validated by the server.
          headers:
            ETag:
              description: Quoted resource version when returning a versioned entity.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/TaskRun
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/domain.schema.json#/$defs/RunReport
  /projects/{id}/contexts:
    post:
      operationId: createContext
      tags:
        - Contexts
      summary: Declare a Context source
      description: Human project member declares exactly one canonical source.
      x-accp-actors:
        - HUMAN
      security:
        - HumanBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Opaque resource identifier; scope is verified server-side.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Successful operation. Human ownership and resource scopes are validated by the server.
          headers:
            ETag:
              description: Quoted resource version when returning a versioned entity.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/Context
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/domain.schema.json#/$defs/CreateContext
    get:
      operationId: listContexts
      tags:
        - Contexts
      summary: List readable Context resources
      description: Current resource ACLs are checked before listing metadata.
      x-accp-actors:
        - HUMAN
        - AGENT
      security:
        - HumanBearer: []
        - AgentBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Opaque resource identifier; scope is verified server-side.
          schema:
            type: string
            minLength: 1
        - name: cursor
          in: query
          required: false
          description: Opaque continuation cursor.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
