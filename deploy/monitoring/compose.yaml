services:
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=30d']
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [private]
    ports: ['127.0.0.1:19090:9090']
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
    secrets: [grafana_password]
    volumes:
      - ../monitoring/datasources.yml:/etc/grafana/provisioning/datasources/accp.yml:ro
      - ../monitoring/dashboards.yml:/etc/grafana/provisioning/dashboards/accp.yml:ro
      - ../monitoring/dashboard.json:/etc/grafana/dashboards/accp.json:ro
      - grafana-data:/var/lib/grafana
    networks: [private]
    ports: ['127.0.0.1:13000:3000']
    restart: unless-stopped
volumes:
  prometheus-data: {}
  grafana-data: {}
secrets:
  grafana_password: {file: '${ACCP_DEPLOY_DIR}/secrets/grafana_password'}
